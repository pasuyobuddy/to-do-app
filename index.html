<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do Alarm</title>
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#16233B; --muted:#5D6B82; --line:#D5DCE6;
  --amber:#F5A300; --amber-ink:#3A2700; --red:#C8372D; --green:#23824F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0E1626; --surface:#18233A; --ink:#EEF2F8; --muted:#9BA8BD; --line:#2A3853;
    --amber:#FFB81F; --amber-ink:#2B1D00; --red:#FF7A6E; --green:#5DD197; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:20px 16px 120px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 2px}
.clock{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.count{text-align:right;color:var(--muted);font-size:14px}
.count b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

.notice{background:var(--surface);border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.notice button{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline}

h2{font-size:14px;font-weight:700;margin:22px 4px 8px;color:var(--muted)}
h2.over{color:var(--red)}
ul{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;background:var(--surface);
  border-radius:10px;margin-bottom:8px;overflow:hidden}
.task .when{align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding:10px 0 10px 12px;
  border-right:1px dashed var(--line)}
.task .t{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.task .d{font-size:12px;color:var(--muted)}
.task .body{background:none;border:0;text-align:left;padding:12px;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.task .title{font-weight:500;word-break:break-word}
.task .meta{font-size:12px;color:var(--muted)}
.task.late .t{color:var(--red)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done .t{color:var(--muted)}
.check{width:44px;height:100%;min-height:60px;background:none;border:0;display:grid;place-items:center}
.check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.task.done .check span{background:var(--green);border-color:var(--green);color:#fff}

.empty{text-align:center;color:var(--muted);padding:48px 20px}
.credit{text-align:center;color:var(--muted);font-size:12px;margin:28px 0 0}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.add{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center}
.btn{border:0;border-radius:10px;padding:14px 18px;font-weight:700;min-height:48px}
.btn.main{background:var(--amber);color:var(--amber-ink)}
.btn.quiet{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--line)}
.add .btn{width:100%;max-width:528px;font-size:17px}

.veil{position:fixed;inset:0;background:rgba(8,14,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input[type=text],input[type=date],input[type=time]{width:100%;background:var(--bg);border:1.5px solid var(--line);
  border-radius:8px;padding:12px;min-height:48px;color-scheme:light dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px;
  background:var(--bg);border-radius:8px}
.switch small{display:block;color:var(--muted);font-weight:400}
.switch input{width:24px;height:24px;accent-color:var(--amber)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.row{display:flex;gap:10px;margin-top:8px}
.row .btn{flex:1}

.ring{align-items:center;padding:16px}
.ring .sheet{border-radius:16px;text-align:center;border-top:8px solid var(--amber)}
.ring p{margin:0;color:var(--muted)}
.ring .what{font-size:26px;font-weight:800;margin:6px 0 18px;word-break:break-word;color:var(--ink)}
.ring .btn{display:block;width:100%;margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .ring.open .sheet{animation:nudge .5s ease-in-out 6}
  @keyframes nudge{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1 id="today"></h1><div class="clock" id="clock">--:--</div></div>
    <div class="count"><b id="left">0</b>left to do</div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="list"></main>
  <p class="credit">Made by PasuyoLabs</p>
</div>

<div class="add"><button class="btn main" id="addBtn">Add task</button></div>

<div class="veil" id="formVeil">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h3 id="formTitle">New task</h3>
    <label for="fTitle">What do you need to do?</label>
    <input type="text" id="fTitle" maxlength="120" autocomplete="off" placeholder="Pay electric bill">
    <div class="two">
      <div><label for="fDate">Date</label><input type="date" id="fDate"></div>
      <div><label for="fTime">Time</label><input type="time" id="fTime"></div>
    </div>
    <div class="switch">
      <label for="fAlarm" style="margin:0">Alarm<small>Ring at this date and time</small></label>
      <input type="checkbox" id="fAlarm" checked>
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="row">
      <button class="btn quiet" id="fCancel">Cancel</button>
      <button class="btn main" id="fSave">Save task</button>
    </div>
    <div class="row" id="fDeleteRow" hidden><button class="btn danger" id="fDelete">Delete task</button></div>
  </div>
</div>

<div class="veil ring" id="ringVeil">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ringWhat">
    <p id="ringWhen"></p>
    <div class="what" id="ringWhat"></div>
    <button class="btn main" id="ringDone">Mark as done</button>
    <button class="btn quiet" id="ringSnooze">Snooze 5 minutes</button>
    <button class="btn quiet" id="ringStop">Stop alarm</button>
  </div>
</div>

<script>
(function(){
'use strict';
var KEY='todoalarm.tasks.v1', NKEY='todoalarm.nextid.v1', CHANNEL='task_alarms_v1', SNOOZE_MIN=5;
var $=function(id){return document.getElementById(id)};

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
var mem={};
function load(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return k in mem?mem[k]:def}}
function save(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var tasks=load(KEY,[]);
function persist(){save(KEY,tasks)}
function nextId(){var n=load(NKEY,1);save(NKEY,n>=2000000000?1:n+1);return n}

/* ---------- native (Android app) alarm bridge ---------- */
var cap=window.Capacitor;
var isNative=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&cap.nativePromise);
function LN(method,opts){return cap.nativePromise('LocalNotifications',method,opts||{})}
var nativeReady=null;
function prepareNative(){
  if(!isNative)return Promise.resolve(false);
  if(nativeReady)return nativeReady;
  nativeReady=LN('createChannel',{id:CHANNEL,name:'Task alarms',description:'Rings when a task is due',
      importance:5,visibility:1,sound:'alarm.wav',vibration:true,lights:true})
    .catch(function(){})
    .then(function(){return LN('checkPermissions')})
    .then(function(p){return p&&p.display==='granted'?p:LN('requestPermissions')})
    .then(function(p){var ok=!!(p&&p.display==='granted');showNotice(ok?'':'perm');return ok})
    .catch(function(){nativeReady=null;return false});
  return nativeReady;
}
function scheduleNative(t){
  if(!isNative)return;
  cancelNative(t).then(function(){
    if(!t.alarm||t.done||t.due<=Date.now())return;
    return prepareNative().then(function(ok){
      if(!ok)return;
      return LN('schedule',{notifications:[{id:t.nid,title:'Time to do this',body:t.title,channelId:CHANNEL,
        sound:'alarm.wav',schedule:{at:new Date(t.due).toISOString(),allowWhileIdle:true},extra:{taskId:t.id}}]});
    });
  }).catch(function(){});
}
function cancelNative(t){
  if(!isNative)return Promise.resolve();
  return LN('cancel',{notifications:[{id:t.nid}]}).catch(function(){});
}

/* ---------- alarm sound while the app is open in a browser ---------- */
var actx=null,beepTimer=null;
function unlockAudio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}
  if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio);
function beep(){
  if(!actx)return;
  [0,.22,.44].forEach(function(off){
    var o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+off;
    o.type='square';o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.25,t0+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+.16);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+.18);
  });
}
function startSound(){if(isNative)return;stopSound();unlockAudio();beep();beepTimer=setInterval(beep,1100);
  if(navigator.vibrate)try{navigator.vibrate([300,150,300,150,300])}catch(e){}}
function stopSound(){if(beepTimer){clearInterval(beepTimer);beepTimer=null}}

/* ---------- dates ---------- */
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function time12(d){var h=d.getHours(),s=h<12?'AM':'PM';h=h%12||12;return {t:h+':'+pad(d.getMinutes()),s:s}}
function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
var DAY=86400000;
function niceDate(d){return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}

/* ---------- render ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  var now=Date.now(),t0=dayStart(new Date()),groups={over:[],today:[],tomorrow:[],later:[],done:[]};
  tasks.slice().sort(function(a,b){return a.due-b.due}).forEach(function(t){
    if(t.done)groups.done.push(t);
    else if(t.due<now)groups.over.push(t);
    else if(t.due<t0+DAY)groups.today.push(t);
    else if(t.due<t0+2*DAY)groups.tomorrow.push(t);
    else groups.later.push(t);
  });
  groups.done.reverse();
  var names={over:'Overdue',today:'Today',tomorrow:'Tomorrow',later:'Later',done:'Done'},html='';
  ['over','today','tomorrow','later','done'].forEach(function(g){
    if(!groups[g].length)return;
    html+='<h2 class="'+(g==='over'?'over':'')+'">'+names[g]+'</h2><ul>';
    groups[g].forEach(function(t){
      var d=new Date(t.due),tt=time12(d);
      html+='<li class="task'+(t.done?' done':'')+(g==='over'?' late':'')+'">'
        +'<div class="when"><span class="t">'+tt.t+'</span><span class="d">'+tt.s+', '+esc(niceDate(d))+'</span></div>'
        +'<button class="body" data-edit="'+t.id+'" aria-label="Edit '+esc(t.title)+'"><span class="title">'+esc(t.title)+'</span>'
        +'<span class="meta">'+(t.alarm?'Alarm on':'No alarm')+'</span></button>'
        +'<button class="check" data-check="'+t.id+'" aria-label="'+(t.done?'Mark as not done':'Mark as done')+'"><span>&#10003;</span></button></li>';
    });
    html+='</ul>';
  });
  if(!tasks.length)html='<div class="empty"><b>Nothing to do yet</b>Add a task, pick the date and time, and the alarm will ring when it is due.</div>';
  $('list').innerHTML=html;
  $('left').textContent=tasks.filter(function(t){return !t.done}).length;
}
function tick(){
  var d=new Date(),tt=time12(d);
  $('clock').textContent=tt.t+' '+tt.s;
  $('today').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  checkDue();
}
function showNotice(kind){
  var n=$('notice');
  if(kind==='perm'){n.hidden=false;n.innerHTML='Notifications are turned off, so alarms cannot ring. Open your phone Settings, find this app, and allow notifications. <button id="retryPerm">Try again</button>';
    $('retryPerm').onclick=function(){nativeReady=null;prepareNative().then(function(ok){if(ok)tasks.forEach(scheduleNative)})}}
  else if(kind==='web'){n.hidden=false;n.style.borderLeftColor='var(--amber)';n.textContent='In a browser the alarm only rings while this page is open. The Android app rings even when it is closed.'}
  else n.hidden=true;
}

/* ---------- ringing ---------- */
var ringing=null,lastMinute='';
function checkDue(){
  var now=Date.now(),changed=false;
  tasks.forEach(function(t){
    if(t.done||!t.alarm||t.rang||t.due>now)return;
    t.rang=true;changed=true;
    if(now-t.due<90000&&!ringing)ring(t);
  });
  var m=hm(new Date());
  if(changed)persist();
  if(changed||m!==lastMinute){lastMinute=m;render()}
}
function ring(t){
  ringing=t;var d=new Date(t.due),tt=time12(d);
  $('ringWhen').textContent='It is '+tt.t+' '+tt.s+'. Time to do this:';
  $('ringWhat').textContent=t.title;
  $('ringVeil').classList.add('open');startSound();$('ringDone').focus();
}
function closeRing(){stopSound();$('ringVeil').classList.remove('open');ringing=null}
$('ringStop').onclick=closeRing;
$('ringDone').onclick=function(){var t=ringing;closeRing();if(t)setDone(t,true)};
$('ringSnooze').onclick=function(){
  var t=ringing;closeRing();if(!t)return;
  t.due=Date.now()+SNOOZE_MIN*60000;t.rang=false;persist();scheduleNative(t);render();
};

/* ---------- add / edit ---------- */
var editing=null;
function openForm(t){
  editing=t||null;
  var d=t?new Date(t.due):new Date(Date.now()+3600000);
  if(!t){d.setMinutes(0,0,0)}
  $('formTitle').textContent=t?'Edit task':'New task';
  $('fTitle').value=t?t.title:'';$('fDate').value=ymd(d);$('fTime').value=hm(d);
  $('fAlarm').checked=t?t.alarm:true;$('fErr').textContent='';
  $('fDeleteRow').hidden=!t;$('fSave').textContent=t?'Save changes':'Save task';
  $('formVeil').classList.add('open');
  if(!t)setTimeout(function(){$('fTitle').focus()},50);
}
function closeForm(){$('formVeil').classList.remove('open');editing=null}
$('addBtn').onclick=function(){openForm()};
$('fCancel').onclick=closeForm;
$('formVeil').addEventListener('click',function(e){if(e.target===this)closeForm()});
$('fSave').onclick=function(){
  var title=$('fTitle').value.trim(),dv=$('fDate').value,tv=$('fTime').value;
  if(!title){$('fErr').textContent='Type what you need to do.';$('fTitle').focus();return}
  if(!dv||!tv){$('fErr').textContent='Pick both a date and a time.';return}
  var p=dv.split('-'),q=tv.split(':'),due=new Date(+p[0],+p[1]-1,+p[2],+q[0],+q[1],0,0).getTime();
  if(isNaN(due)){$('fErr').textContent='That date or time is not valid.';return}
  var alarm=$('fAlarm').checked;
  if(alarm&&due<=Date.now()&&!(editing&&editing.due===due)){$('fErr').textContent='That time has already passed. Pick a later time, or turn the alarm off.';return}
  var t=editing;
  if(t){if(t.due!==due)t.rang=due<=Date.now();t.title=title;t.due=due;t.alarm=alarm}
  else{var n=nextId();t={id:'t'+n,nid:n,title:title,due:due,alarm:alarm,done:false,rang:due<=Date.now()};tasks.push(t)}
  persist();scheduleNative(t);closeForm();render();
};
$('fDelete').onclick=function(){
  var t=editing;if(!t)return;
  cancelNative(t);tasks=tasks.filter(function(x){return x.id!==t.id});persist();closeForm();render();
};
function setDone(t,done){
  t.done=done;persist();
  if(done)cancelNative(t);else scheduleNative(t);
  render();
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var id=b.getAttribute('data-check')||b.getAttribute('data-edit');
  var t=tasks.filter(function(x){return x.id===id})[0];if(!t)return;
  if(b.hasAttribute('data-check'))setDone(t,!t.done);else openForm(t);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ringing)closeForm()});

/* ---------- start ---------- */
if(isNative){prepareNative().then(function(ok){if(ok)tasks.forEach(function(t){if(t.alarm&&!t.done&&t.due>Date.now())scheduleNative(t)})})}
else showNotice('web');
render();tick();setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
})();
</script>
</body>
</html>
