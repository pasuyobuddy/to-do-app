/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {

.nav button.on{color:var(--accent)}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:600}
.mapbtns{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.flg{font-size:30px;line-height:34px;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.flg b{position:absolute;right:-6px;top:-4px;font:700 11px/1 sans-serif;background:#D7141A;color:#fff;border-radius:9px;padding:2px 5px;border:1.5px solid #fff}
.flg.dim{opacity:.4}
.rdr{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #1D3F8F;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.rdr:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid rgba(29,63,143,.5);animation:rpulse 1.6s ease-out infinite}
@keyframes rpulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.3);opacity:0}}
.map{height:260px;border-radius:12px;overflow:hidden;position:relative;background:var(--soft);z-index:1}
.pin{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-30px 0 0 -15px;z-index:450;pointer-events:none;font-size:30px;line-height:30px;text-align:center}
.sug{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.sug button:last-child{border-bottom:none}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.step .mk{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;flex-shrink:0;margin-top:2px}
.step.done .mk{background:var(--accent);border-color:var(--accent)} .step.now .mk{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.step.now{font-weight:800} .step.todo{color:var(--muted)}
.stars{display:flex;gap:6px} .stars button{border:none;background:none;font-size:34px;line-height:1;cursor:pointer;color:#C9C6BC;padding:0}
.stars button.on{color:#E0A100}
.logo{width:64px;height:64px;border-radius:18px;background:var(--yellow);color:var(--accent);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:24px auto 8px}
.chatbox{display:flex;flex-direction:column;gap:8px;padding:14px 16px 170px}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .t{display:block;font-size:11px;opacity:.75;margin-top:3px}
.chatbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;z-index:600}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;max-width:90%;z-index:2000;font-weight:600;text-align:center}
.toast.err{background:var(--bad)}
.spin{padding:40px 0;text-align:center;color:var(--muted)}
a{color:var(--accent);font-weight:700}
</style>
</head>

async function reloadMe() { S.me = await rpc("rider_me"); if (S.me && S.me.auto_offline) S.autoOff = true; }
async function afterLogin() {
  try { await reloadMe(); } catch (e) { S.session = null; S.authMsg = e.message; S.view = "auth"; if (/deactivated/i.test(e.message)) { try { await sb.auth.signOut(); } catch (x) {} } render(); return; }
  checkPush().then(function () { if (S.view === "home" || S.view === "account") render(); });
  topupReturn().then(function () { if (/[?&]topup=/.test(location.search) === false && S.view === "wallet") render(); });
  await route();
}
async function route() {
  var r = rider();
  if (!r) { S.view = "apply"; render(); return; }
  if (r.status !== "approved") { S.view = "docs"; render(); return; }
  startGps();
  if (S.me.active_order) { await openJob(S.me.active_order); return; }
  await goHome();
}
async function doAuth() {
  var email = val("a_email"), pw = $("a_pw") ? $("a_pw").value : ""; S.authEmail = email; S.authMsg = "";
  if (!email || !pw) { toast("Enter your email and password", true); return; }
  await run(async function () {
    if (S.authMode === "signup") {
      if (pw.length < 8) throw new Error("Password must be at least 8 characters");
      var r = await sb.auth.signUp({ email: email, password: pw, options: (location.protocol === "https:" ? { emailRedirectTo: location.origin + location.pathname } : {}) });
      if (r.error) throw new Error(r.error.message);
      if (!r.data || !r.data.session) { S.authMode = "login"; S.authMsg = "Account created. Open the email we sent to " + email + " and tap the link to confirm, then log in here."; render(); return; }
      S.session = r.data.session;
    } else {
      var r2 = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (r2.error) throw new Error(r2.error.message === "Email not confirmed" ? "Please confirm your email first. Check your inbox for the link." : r2.error.message);
      S.session = r2.data.session;
    }
    await afterLogin();
  });
}
async function signOut() {
  stopTimers(); stopGps();
  try { if (rider() && rider().is_online) await rpc("rider_set_online", { p_online: false }); } catch (e) {}
  await sb.auth.signOut(); S.session = null; S.me = null; S.order = null; S.jobs = null; S.pos = null; S.view = "auth"; render();
}

// ---------------- Application and documents ----------------
async function apply() {
  var name = val("ap_name"), phone = val("ap_phone"), plate = val("ap_plate"), veh = Number(val("ap_vehicle"));
  if (!name) { toast("Please enter your full name", true); return; }
  if (!phoneOk(phone)) { toast(PHONE_MSG, true); return; }
  if (plate.length < 4) { toast("Enter your plate number", true); return; }
  await run(async function () { await rpc("rider_apply", { p_name: name, p_phone: phoneDigits(phone), p_vehicle: veh, p_plate: plate }); await reloadMe(); S.busy = false; await route(); toast("Application saved. Now upload your documents."); });
}
// Shrink photos before upload so they are quick to send on mobile data.
function shrink(file) {
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) { reject(new Error("Please choose a photo")); return; }
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () { var max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error("Could not read that photo")); }, "image/jpeg", 0.75); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Could not read that photo")); };
    img.src = url;
  });
}
async function upload(bucket, name, file) {
  var blob = await shrink(file), path = S.me.id + "/" + name + "_" + Date.now() + ".jpg";
  var r = await sb.storage.from(bucket).upload(path, blob, { contentType: "image/jpeg", upsert: false });
  if (r.error) throw new Error("Upload failed: " + r.error.message);
  return path;
}
async function uploadDoc(type, file) {
  await run(async function () { toast("Uploading…"); var path = await upload("rider-docs", type, file); await rpc("rider_add_document", { p_type: type, p_path: path }); await reloadMe(); render(); toast("Uploaded. Waiting for review."); });
}
async function checkStatus() { await run(async function () { await reloadMe(); S.busy = false; await route(); if (rider().status !== "approved") toast("Not approved yet"); }); }

// ---------------- Jobs ----------------
var jobsT = null, jobT = null, polls = 0;
function stopTimers() { if (jobsT) { clearInterval(jobsT); jobsT = null; } if (jobT) { clearInterval(jobT); jobT = null; } }
function beep() { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); var C = window.AudioContext || window.webkitAudioContext; if (!C) return; var a = new C(), o = a.createOscillator(), g = a.createGain();
  o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.value = 0.15; o.start(); setTimeout(function () { o.stop(); a.close(); }, 350); } catch (e) {} }
async function loadJobs() {
  if (S.view !== "home" || !rider() || !rider().is_online) return;

// The rider's way to the next stop (blue), re-drawn when the rider has moved about 250 m

var TOPUP = { amount: 300, quote: null, list: null, busy: false };
async function loadTopupQuote() { try { TOPUP.quote = await rpc("topup_quote", { p_amount_pesos: TOPUP.amount }); } catch (e) { TOPUP.quote = { error: e.message }; } var q = $("tq"); if (q) q.innerHTML = topupQuoteText(); }
function topupQuoteText() { var q = TOPUP.quote; if (!q) return '<span class="muted">Checking…</span>'; if (q.error) return '<span style="color:var(--bad)">' + h(q.error) + "</span>";
  return 'Load <b>' + peso(q.amount) + '</b> + GCash fee ' + peso(q.fee) + ' = <b>you pay ' + peso(q.charged) + "</b>"; }
function topupCard(w) {
  var chips = [300, 500, 1000, 2000].map(function (a) { return '<button class="chip' + (TOPUP.amount === a ? " on" : "") + '" data-act="tuamt" data-v="' + a + '">₱' + a + "</button>"; }).join("");
  var recent = (TOPUP.list || []).filter(function (t) { return t.status !== "expired" || Date.now() - new Date(t.created_at).getTime() < 864e5; }).slice(0, 3).map(function (t) {
    return '<div class="line small"><span class="sp">' + peso(t.amount) + ' <span class="muted">· ' + h(new Date(t.created_at).toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "Asia/Manila" })) + "</span></span>" + pill(t.status === "paid" ? "Added" : t.status === "pending" ? "Waiting for payment" : "Not paid", t.status === "paid" ? "good" : t.status === "pending" ? "warn" : "soft") + "</div>"; }).join("");
  return '<div class="card" style="display:flex;flex-direction:column;gap:10px;border-color:#0B6BFF"><h2 style="margin:0">Top up with GCash</h2>'
    + '<div class="chips">' + chips + '</div><div class="field"><label for="tu_amt">Or type an amount (₱)</label><input class="in" id="tu_amt" type="number" inputmode="numeric" min="100" max="5000" value="' + TOPUP.amount + '"></div>'
    + '<div class="small" id="tq">' + topupQuoteText() + "</div>"
    + '<button class="btn pri" style="background:#0B6BFF;border-color:#0B6BFF" data-act="tupay">Pay with GCash</button>'
    + '<div class="small muted">The load is added to your wallet automatically a few seconds after you pay. Minimum wallet to receive cash jobs: ' + peso(w.min_load) + ". Top-up load is used to pay commissions and is not refundable.</div>"
    + (recent ? '<div><div class="small b" style="margin-top:4px">Recent GCash top-ups</div>' + recent + "</div>" : "") + "</div>";
}
async function payTopup() {
  var v = Number(val("tu_amt")); if (v) TOPUP.amount = v;
  await run(async function () {
    var r = await sb.functions.invoke("topup-create", { body: { amount: TOPUP.amount, return_to: location.origin + location.pathname } });
    var d = r.data, err = r.error;
    if (err) { var msg = err.message; try { var b = err.context && (await err.context.json()); if (b && b.error) msg = b.error; } catch (x) {} throw new Error(msg); }
    if (!d || !d.checkout_url) throw new Error((d && d.error) || "Could not open GCash. Please try again.");
    toast("Opening GCash…"); location.href = d.checkout_url;
  });
}
async function refreshTopups() { try { TOPUP.list = await rpc("rider_topups"); } catch (e) { TOPUP.list = null; } }
// Back from PayMongo: wait for the webhook to add the load, then show it
async function topupReturn() {
  var p = new URLSearchParams(location.search).get("topup"); if (!p) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  if (p === "cancel") { toast("GCash payment cancelled", true); return; }
  toast("Payment received. Adding your load…");
  for (var i = 0; i < 12; i++) { await new Promise(function (r) { setTimeout(r, 2500); }); await refreshTopups(); if ((TOPUP.list || []).some(function (t) { return t.status === "paid" && Date.now() - new Date(t.paid_at).getTime() < 15 * 60000; })) break; }
  try { await reloadMe(); S.wallet = await rpc("rider_wallet"); } catch (e) {}
  render(); toast((TOPUP.list || []).some(function (t) { return t.status === "paid" && Date.now() - new Date(t.paid_at).getTime() < 15 * 60000; }) ? "Load added to your wallet" : "Payment is still being confirmed. Check your wallet in a minute.");
}

    + '<label class="btn sm' + (p ? "" : " pri") + '" style="cursor:pointer;width:auto">' + (p ? "Retake selfie" : "Take selfie") + '<input type="file" accept="image/*" capture="user" data-photo="1" hidden></label></div></div>';
}
async function uploadPhoto(file) { await run(async function () { toast("Uploading…"); var path = await upload("avatars", "photo", file); await rpc("rider_set_photo", { p_path: path }); await reloadMe(); render(); toast("Profile photo saved"); }); }
function vAccount() {
  var r = rider();
  return topBar("Account") + '<div class="body">' + photoCard() + pushCard(true) + '<div class="card"><div class="line"><span class="muted">Name</span><span class="b">' + h(S.me.name) + '</span></div><div class="line"><span class="muted">Mobile</span><span>' + h(phoneFmt(S.me.phone)) + '</span></div><div class="line"><span class="muted">Vehicle</span><span>' + h(r.vehicle) + " · " + h(r.plate) + '</span></div><div class="line"><span class="muted">Rating</span><span>★ ' + h(r.rating) + " (" + h(r.rating_count) + ')</span></div><div class="line"><span class="muted">Jobs done</span><span>' + h(r.completed_jobs) + "</span></div></div>"
    + '<div class="card"><h2>Which jobs do you want to see?</h2><div class="small muted" style="margin-bottom:6px">Whole region = every job in your region, even far from you.</div><div class="chips">'
    + (S.me.regions || []).map(function (g) { return '<button class="chip ' + (r.region_id === g.id ? "on" : "") + '" data-act="region" data-v="' + g.id + '">Whole ' + h(g.name) + "</button>"; }).join("")
    + '<button class="chip ' + (!r.region_id ? "on" : "") + '" data-act="region" data-v="">Nearby only</button></div>'
    + (!r.region_id ? '<h2 style="margin-top:14px">How far will you go for a pickup?</h2><div class="chips">' + [1000, 3000, 5000, 10000].map(function (m) { return '<button class="chip ' + (r.radius_m === m ? "on" : "") + '" data-act="radius" data-v="' + m + '">' + (m / 1000) + " km</button>"; }).join("") + "</div>" : "") + "</div>"
    + '<button class="btn bad" data-act="signout">Sign out</button><div class="muted small" style="text-align:center">Rider app version ' + CONFIG.version + "</div></div>" + nav("account");
}
function render() {
  killMap(); var v = S.view;
  $("app").innerHTML = v === "report" ? vReport() : v === "chat" ? vChat() : v === "confirmed" ? vConfirmed() : v === "auth" ? vAuth() : v === "apply" ? vApply() : v === "docs" ? vDocs() : v === "job" ? vJob() : v === "done" ? vDone() : v === "wallet" ? vWallet() : v === "history" ? vHistory() : v === "account" ? vAccount() : vHome();
  if (v === "job") drawJobMap();
}

// ---------------- Events ----------------
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-act]"); if (!t) return; var a = t.getAttribute("data-act"), d = t.dataset;
  if (a === "auth") doAuth();
  else if (a === "authmode") { S.authEmail = val("a_email"); S.authMode = S.authMode === "login" ? "signup" : "login"; S.authMsg = ""; render(); }
  else if (a === "signout") signOut();
  else if (a === "tuamt") { TOPUP.amount = +d.v; var inp = $("tu_amt"); if (inp) inp.value = d.v; document.querySelectorAll('[data-act="tuamt"]').forEach(function (b) { b.classList.toggle("on", b === t); }); TOPUP.quote = null; loadTopupQuote(); }
  else if (a === "tupay") payTopup();
  else if (a === "e2l") earningsToLoad();
  else if (a === "pushon") enablePush();
  else if (a === "pushoff") disablePush();
  else if (a === "chatopen") { if (S.order) openChat(S.order.id); }
  else if (a === "repopen") { REP_FROM = d.from || "job"; var oid = d.id || (S.order && S.order.id); if (oid) openReport(oid); }
  else if (a === "repback") { if (REP_FROM === "job") openJob(REP.order); else goHome(); }
  else if (a === "repreason") { var nv = $("rep_note") ? $("rep_note").value : ""; REP.reason = REP_REASONS[+d.i]; render(); if ($("rep_note")) $("rep_note").value = nv; }
  else if (a === "repsend") sendReport();
  else if (a === "chatback") { stopChat(); openJob(CHAT.id); }
  else if (a === "chatsend") sendChat(val("chat_in"));
  else if (a === "chatquick") sendChat(CHAT_QUICK[+d.i]);
  else if (a === "hidejob") { HIDDEN[d.id] = Date.now(); saveHidden(); render(); toast("Job hidden. Other riders can still take it."); }
  else if (a === "unhidejobs") { HIDDEN = {}; saveHidden(); render(); }
  else if (a === "confirmedgo") { S.confirmErr = ""; if (S.session) afterLogin(); else { S.view = "auth"; S.authMode = "login"; render(); } }
  else if (a === "mapme") { if (mapObj && S.pos) mapObj.setView([S.pos.lat, S.pos.lng], 16); else toast("Finding your location…", true); }
  else if (a === "mapall") { if (mapObj && S.order) { var q = S.order.stops.map(function (x) { return [x.lat, x.lng]; }); if (S.pos) q.push([S.pos.lat, S.pos.lng]); mapObj.fitBounds(q, { padding: [28, 28], maxZoom: 16 }); } }
  else if (a === "apply") apply();
  else if (a === "check") checkStatus();
  else if (a === "online") setOnline(d.v === "1");
  else if (a === "home") run(async function () { await reloadMe(); S.busy = false; if (S.me.active_order) await openJob(S.me.active_order); else await goHome(); });
  else if (a === "wallet") showWallet();
  else if (a === "history") showHistory();
  else if (a === "account") { stopTimers(); S.view = "account"; render(); }
  else if (a === "accept") accept(d.id);
  else if (a === "step") step(d.s.split(","));
  else if (a === "canceljob") cancelJob();
  else if (a === "asknone") { S.ask = ""; render(); }
  else if (a === "stopform") { S.stopForm = { file: null, name: "" }; S.ask = ""; render(); }
  else if (a === "stopcancel") { S.stopForm = null; render(); }
  else if (a === "delivered") finishStop(false);
  else if (a === "failask") { S.ask = "fail"; render(); }
  else if (a === "failed") { S.ask = ""; finishStop(true); }
  else if (a === "finish") finishJob();
  else if (a === "cashout") cashOut();
  else if (a === "radius") setRadius(+d.v);
  else if (a === "region") setRegion(d.v ? +d.v : null);
});
var tuT = null;
document.addEventListener("input", function (ev) { if (ev.target && ev.target.id === "tu_amt") { clearTimeout(tuT); tuT = setTimeout(function () { var v = Number(ev.target.value); if (v) { TOPUP.amount = v; TOPUP.quote = null; document.querySelectorAll('[data-act="tuamt"]').forEach(function (b) { b.classList.toggle("on", +b.dataset.v === v); }); loadTopupQuote(); } }, 400); } });
document.addEventListener("change", function (ev) {
  var t = ev.target; if (t.type !== "file" || !t.files || !t.files[0]) return;
  if (t.dataset.doc) uploadDoc(t.dataset.doc, t.files[0]);
  else if (t.dataset.photo) uploadPhoto(t.files[0]);
  else if (t.dataset.pod && S.stopForm) { S.stopForm.name = val("st_name"); S.stopForm.file = t.files[0]; render(); }
});
document.addEventListener("input", function (ev) { var id = ev.target.id; if (id === "ap_phone" || id === "w_gcash") ev.target.value = phoneFmt(ev.target.value); });
document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && (ev.target.id === "a_pw" || ev.target.id === "a_email")) doAuth(); });
// Installable app: register the service worker when served from the website (not from a local file)
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
boot();
</script>
